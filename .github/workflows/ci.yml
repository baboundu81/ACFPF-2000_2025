name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: JavaScript syntax
        run: |
          for script in src/acfpf/web/static/js/*.js; do
            node --check "$script"
          done
      - name: Tests
        run: pytest
      - name: Live Assemblée nationale smoke test
        env:
          ACFPF_LIVE_SOURCES: "1"
        run: pytest -q -s tests/test_live_official_legislation.py tests/test_live_official_documents.py
