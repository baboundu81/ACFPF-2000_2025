name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: JavaScript syntax
        run: |
          for script in src/acfpf/web/static/js/*.js; do
            node --check "$script"
          done
      - name: JavaScript behavior
        run: node --test tests/js/*.test.js
      - name: Tests
        run: pytest
      - name: Live Assemblée nationale smoke test
        env:
          ACFPF_LIVE_SOURCES: "1"
        run: pytest -q -s tests/test_live_official_legislation.py tests/test_live_official_documents.py tests/test_live_official_votes.py tests/test_live_official_fulltext.py tests/test_live_official_actors.py tests/test_live_official_reports.py tests/test_live_official_debates.py

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/acfpf-wheel-check
          /tmp/acfpf-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/acfpf-wheel-check/bin/python -m pip check
      - name: Check installed application outside checkout
        working-directory: /tmp
        run: |
          /tmp/acfpf-wheel-check/bin/python -I "$GITHUB_WORKSPACE/tests/check_installed_distribution.py"
          /tmp/acfpf-wheel-check/bin/acfpf --help
