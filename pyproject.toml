[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acfpf"
version = "0.2.0"
description = "Analyse citoyenne des finances publiques françaises 2000-2025"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.31",
  "openpyxl>=3.1",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "pypdf>=5.0",
]

[project.scripts]
acfpf = "acfpf.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "jupyterlab>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acfpf.web" = [
  "templates/*.html",
  "static/css/*.css",
  "static/js/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
